[scene]

; Anzeigename (erscheint im Server-HUD und beim Szenenübergang)
name = "Team X – Titel der Installation"

; Dauer in Sekunden bis automatisch zur nächsten Szene gewechselt wird.
; -1.0 = kein Auto-Wechsel (Pablo wechselt manuell mit Taste N)
duration = 120.0

; Dateiname eurer Hauptszene – liegt in diesem Ordner
scene_file = "team_scene.tscn"

; Euer Teamname (erscheint kurz beim Szenenwechsel)
team = "Team X"

; Kurzbeschreibung eurer Installation (optional, eine Zeile)
; info = "Interaktive Klang-Installation"

; Avatar-Variante für eure Szene (optional)
; Wenn nicht gesetzt: Standard-Avatar (Ringe / Dynamic Cone)
; Andere Optionen:
;   avatar = "res://addons/situs_core/avatar/variants/avatar_capsule.tscn"   – Kapsel + Kugel
;   avatar = "res://addons/situs_core/avatar/variants/avatar_sphere.tscn"    – Einzelne Kugel
;   avatar = "res://addons/situs_core/avatar/variants/avatar_box.tscn"       – Quader
;   avatar = "res://addons/situs_core/avatar/variants/avatar_ghost.tscn"     – Semitransparente Geisterform

; Spielerfarbe (optional)
; Nicht gesetzt → jeder Spieler hat seine eigene Farbe aus einer 8-Farb-Palette.
; Gesetzt → alle Spieler in dieser Szene haben dieselbe Farbe (einheitliches Erscheinungsbild).
; Beispiel für Weiß: player_color = Color(1.0, 1.0, 1.0, 1)
